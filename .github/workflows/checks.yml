name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_USER: runner
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runner -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CAMP_INTEGRATION_DATABASE_URL: postgresql://runner@localhost/postgres
      CAMP_TEST_DATABASE_URL: postgresql://runner@localhost/camp_test
      CAMP_ENV_FILE: /dev/null
      CAMP_DATABASE_URL: ""
      CAMP_DB: ":memory:"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install uv==0.8.22
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check src tests
      - run: uv run --frozen mypy
      - run: uv run --frozen pytest -q
      - run: uv run --frozen python -m compileall -q src tests
      - run: uv build --no-sources

  native:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: xcodebuild -version
      - run: xcrun swift test --disable-sandbox
      - run: bash scripts/build-mac.sh
      - run: bash scripts/build-ios.sh
