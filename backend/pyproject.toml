[project]
name = "camp"
version = "0.1.0"
description = "CAMP (Corporate Automatic Meal Protocol) recommendation core"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-ai-slim[typesafe,openai]>=2.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=1.26",
    "ortools>=9.10",
    "typer>=0.12",
    "httpx[http2]>=0.27",
    "psycopg[binary]>=3.2",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff==0.12.12",
    "mypy==1.18.2",
]

[project.scripts]
camp = "camp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
files = ["src/camp/contracts.py", "src/camp/models.py"]
follow_imports = "silent"
check_untyped_defs = true
warn_unused_ignores = true

[tool.hatch.build.targets.wheel]
packages = ["src/camp"]
