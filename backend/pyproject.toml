[project]
name = "camp"
version = "0.1.0"
description = "CAMP (Corporate Automatic Meal Protocol) recommendation core"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-ai-slim[typesafe,anthropic]>=2.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=1.26",
    "ortools>=9.10",
    "typer>=0.12",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
camp = "camp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/camp"]
